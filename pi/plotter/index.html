<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:;base64,=" />
  <title>BSP Control</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #111;
      background: #f7f7f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 16px;
    }

    h1,
    h2 {
      margin: 0 0 12px;
      line-height: 1.1;
    }

    h1 {
      font-size: 28px;
    }

    h2 {
      font-size: 18px;
    }

    section {
      margin: 0 0 18px;
      padding: 14px 0;
      border-top: 1px solid #d8d8d0;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    button,
    input::file-selector-button,
    .button-link {
      min-height: 44px;
      border: 1px solid #222;
      border-radius: 6px;
      background: #fff;
      color: #111;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      padding: 10px 12px;
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    button:active,
    input::file-selector-button:active,
    .button-link:active {
      transform: translateY(1px);
    }

    button.primary {
      background: #111;
      color: #fff;
    }

	    input[type="file"] {
	      width: 100%;
	      min-height: 44px;
	      font: inherit;
	      margin: 6px 0 12px;
	    }

	    .control-panel {
	      display: grid;
	      gap: 12px;
	      max-width: 520px;
	    }

	    .endpoint-row {
	      display: grid;
	      grid-template-columns: minmax(130px, auto) minmax(220px, 1fr) auto;
	      gap: 10px;
	      align-items: center;
	    }

	    .toggle-row,
	    .slider-row {
	      display: grid;
	      grid-template-columns: minmax(150px, 1fr) minmax(180px, 2fr) 56px;
	      gap: 10px;
	      align-items: center;
	    }

	    .toggle-row {
	      grid-template-columns: minmax(150px, 1fr) auto 56px;
	      justify-content: start;
	    }

	    label {
	      font-weight: 650;
	    }

	    input[type="checkbox"] {
	      width: 24px;
	      height: 24px;
	    }

	    input[type="url"],
	    select {
	      width: 100%;
	      min-height: 44px;
	      border: 1px solid #999;
	      border-radius: 6px;
	      background: #fff;
	      color: #111;
	      font: inherit;
	      padding: 10px 12px;
	    }

    .select-row {
      display: grid;
      grid-template-columns: minmax(170px, 1fr) minmax(220px, 2fr);
      gap: 10px;
      align-items: center;
    }

    .field-help {
      color: #555;
      font-size: 13px;
    }

    .field-label {
      margin: 12px 0 7px;
      font-weight: 700;
    }

    .option-grid > .field-help {
      grid-column: 1 / -1;
    }

    input[readonly] {
      background: #ecece7;
      color: #444;
    }

    fieldset {
      margin: 0;
      padding: 12px;
      border: 1px solid #c8c8c0;
      border-radius: 6px;
    }

    legend {
      padding: 0 6px;
      font-weight: 700;
    }

    .runpod-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .status-pill {
      display: inline-block;
      min-width: 82px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #ddd;
      font-size: 13px;
      font-weight: 750;
      text-align: center;
      text-transform: uppercase;
    }

    .status-pill.running {
      background: #ccebd2;
      color: #155c25;
    }

    .status-pill.starting,
    .status-pill.stopping {
      background: #ffe8ac;
      color: #704f00;
    }

    .status-pill.error,
    .status-pill.blocked {
      background: #ffd0cc;
      color: #7d1810;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 7px 14px;
    }

    .option-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-weight: 500;
    }

    .option-item input {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      margin-top: 1px;
    }

    .runpod-details {
      padding: 9px 11px;
      border-radius: 6px;
      background: #ecece7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    input[type="range"] {
      width: 100%;
    }

    .hidden-input {
      display: none;
    }

	    .value-text {
	      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	      font-size: 13px;
	      text-align: right;
	    }

    .media-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }

    .media-grid.no-preview {
      grid-template-columns: 1fr;
    }

    .preview-frame {
      width: 100%;
      border: 1px solid #222;
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
    }

    .preview-frame.hidden {
      display: none;
    }

    #camera-preview {
      width: 100%;
      height: auto;
      display: block;
    }

    #path-preview {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
      display: block;
    }

    .status-text {
      min-height: 24px;
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #status {
      display: block;
      padding: 10px;
      border: 1px solid #d8d8d0;
      border-radius: 6px;
      background: #fff;
    }

    @media (max-width: 700px) {
      main {
        padding: 12px;
      }

      h1 {
        font-size: 24px;
      }

	      .media-grid {
	        grid-template-columns: 1fr;
	      }

	      .toggle-row,
	      .slider-row,
	      .endpoint-row,
        .select-row {
	        grid-template-columns: 1fr;
	      }

	      .value-text {
	        text-align: left;
	      }
	    }
  </style>
  <script>
    const dim = 400;
    let previewPath = [];
    let pendingPathPreviewed = false;
    let runpodConfigDirty = false;
    let runpodOptionSignature = "";
    let latestRunpodStatus = null;

    function setText(id, text) {
      document.getElementById(id).innerText = text;
    }

    function formatDuration(totalSeconds) {
      const seconds = Math.max(0, Math.round(Number(totalSeconds) || 0));
      if (seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      if (minutes < 60) return `${minutes}m ${remainder}s`;
      const hours = Math.floor(minutes / 60);
      return `${hours}h ${minutes % 60}m ${remainder}s`;
    }

    async function getJson(url) {
      const response = await fetch(url);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.error || response.statusText);
      }
      return body;
    }

    async function fetchCommand(url) {
      const response = await fetch(url, {
        cache: "no-store",
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.error || response.statusText);
      }
      return body;
    }

    function checkStatus() {
      getJson("/status")
        .then((status) => {
          setText("status", JSON.stringify(status, null, 2));
          if (status.runpod) {
            renderRunpodSummary(status.runpod);
          }
          maybePreviewReadyPath(status);
        })
        .catch((error) => {
          setText("status", `Status failed: ${error.message}`);
        });
    }

    function maybePreviewReadyPath(status) {
      if (!status || status.state !== "READY" || !status.has_pending_path) {
        pendingPathPreviewed = false;
        return;
      }
      if (pendingPathPreviewed) {
        return;
      }
      pendingPathPreviewed = true;
      setText("upload-status", "Previewing ready path...");
      getJson("/pending-path")
        .then((body) => {
          previewJson(body.path || body);
          document.getElementById("json-plot-grid").classList.remove("no-preview");
          setText("upload-status", "Ready path preview.");
        })
        .catch((error) => {
          pendingPathPreviewed = false;
          setText("upload-status", `Ready path preview failed: ${error.message}`);
        });
    }

    function runMachineCommand(label, url) {
      setText("command-status", `${label} sent...`);
      fetchCommand(url)
        .then(() => {
          setText("command-status", `${label} accepted.`);
          checkStatus();
        })
        .catch((error) => {
          setText("command-status", `${label} failed: ${error.message}`);
          checkStatus();
        });
    }

	    function takePreviewPhoto() {
	      const img = document.getElementById("camera-preview");
	      const frame = document.getElementById("camera-preview-frame");
	      const status = document.getElementById("preview-status");
	      const nextImg = new Image();
	      status.innerText = "Capturing preview...";
	      nextImg.onload = () => {
	        img.src = nextImg.src;
	        frame.classList.remove("hidden");
	        status.innerText = "Preview ready.";
	      };
	      nextImg.onerror = () => {
	        status.innerText = "Preview failed.";
	      };
	      nextImg.src = `/camera-preview.jpg?t=${Date.now()}`;
	    }

	    function updateCameraSettingLabels() {
	      const exposure = document.getElementById("camera-exposure");
	      const gain = document.getElementById("camera-gain");
	      const autoExposure = document.getElementById("camera-auto-exposure");
	      document.getElementById("camera-exposure-value").innerText = exposure.value;
	      document.getElementById("camera-gain-value").innerText = gain.value;
	      exposure.disabled = autoExposure.checked;
	    }

	    function applyCameraSettingsToForm(settings) {
	      document.getElementById("camera-auto-exposure").checked = Boolean(settings.auto_exposure_enabled);
	      if (Number.isFinite(settings.exposure_time_absolute)) {
	        const exposure = document.getElementById("camera-exposure");
	        exposure.value = Math.min(Number(exposure.max), Math.max(Number(exposure.min), settings.exposure_time_absolute));
	      }
	      if (Number.isFinite(settings.gain)) {
	        const gain = document.getElementById("camera-gain");
	        gain.value = Math.min(Number(gain.max), Math.max(Number(gain.min), settings.gain));
	      }
	      updateCameraSettingLabels();
	    }

	    function loadCameraSettings() {
	      setText("camera-settings-status", "Loading...");
	      getJson("/camera-settings")
	        .then((settings) => {
	          applyCameraSettingsToForm(settings);
	          setText("camera-settings-status", "Loaded.");
	        })
	        .catch((error) => {
	          setText("camera-settings-status", `Load failed: ${error.message}`);
	        });
	    }

	    function saveCameraSettings() {
	      const autoExposureEnabled = document.getElementById("camera-auto-exposure").checked;
	      const payload = {
	        auto_exposure_enabled: autoExposureEnabled,
	        gain: Number(document.getElementById("camera-gain").value),
	      };
	      if (!autoExposureEnabled) {
	        payload.exposure_time_absolute = Number(document.getElementById("camera-exposure").value);
	      }
	      setText("camera-settings-status", "Saving...");
	      return fetch("/camera-settings", {
	        method: "POST",
	        headers: {
	          "Content-Type": "application/json",
	        },
	        body: JSON.stringify(payload),
	      })
	        .then(async (response) => {
	          const body = await response.json().catch(() => ({}));
	          if (!response.ok) {
	            throw new Error(body.error || response.statusText);
	          }
	          return body;
	        })
	        .then((settings) => {
	          applyCameraSettingsToForm(settings);
	          setText("camera-settings-status", "Saved.");
	          return settings;
	        })
	        .catch((error) => {
	          setText("camera-settings-status", `Save failed: ${error.message}`);
	          throw error;
	        });
	    }

	    function previewWithCurrentCameraSettings() {
	      setText("preview-status", "");
	      saveCameraSettings()
	        .then(() => {
	          takePreviewPhoto();
	        })
	        .catch(() => {});
	    }

    function renderRunpodSummary(runpod) {
      const status = runpod.status || "error";
      const pill = document.getElementById("runpod-status-pill");
      pill.innerText = status;
      pill.className = `status-pill ${status}`;
      setText("runpod-status-message", runpod.message || "");
      const endpoint = runpod.endpoint || "";
      document.getElementById("processor-endpoint-url").value = endpoint;
      const openLink = document.getElementById("processor-endpoint-open");
      openLink.href = endpoint ? endpoint.replace(/\/api\/process$/, "/") : "#";
      openLink.style.pointerEvents = endpoint ? "auto" : "none";
      openLink.style.opacity = endpoint ? "1" : "0.45";
      const detailLines = [];
      if (runpod.pod_id) detailLines.push(`Pod: ${runpod.pod_id}`);
      if (runpod.gpu_name || runpod.gpu_id) detailLines.push(`Card: ${runpod.gpu_name || runpod.gpu_id}`);
      if (runpod.data_center_id) detailLines.push(`Region: ${runpod.data_center_id}`);
      if (Number.isFinite(runpod.cost_per_hour)) detailLines.push(`Rate: $${Number(runpod.cost_per_hour).toFixed(2)}/hr`);
      if (runpod.phase) detailLines.push(`Phase: ${runpod.phase}`);
      if (Number.isFinite(runpod.startup_duration_seconds)) {
        detailLines.push(`Startup time: ${formatDuration(runpod.startup_duration_seconds)}`);
      } else if (Number.isFinite(runpod.startup_elapsed_seconds)) {
        detailLines.push(`Startup time: ${formatDuration(runpod.startup_elapsed_seconds)} elapsed`);
      }
      setText("runpod-details", detailLines.length ? detailLines.join("\n") : "No managed pod yet.");
      document.getElementById("runpod-start").disabled = status === "running";
      document.getElementById("runpod-stop").disabled = status === "stopped" && !runpod.desired_running;
    }

    function selectedRunpodValues(name) {
      return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map((input) => input.value);
    }

    function addRunpodOption(container, name, value, label, checked, onChange = null) {
      const row = document.createElement("label");
      row.className = "option-item";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.name = name;
      checkbox.value = value;
      checkbox.checked = checked;
      checkbox.addEventListener("change", () => {
        runpodConfigDirty = true;
        setText("runpod-config-status", "Unsaved deployment preference changes.");
        if (onChange) onChange();
      });
      const text = document.createElement("span");
      text.innerText = label;
      row.append(checkbox, text);
      container.append(row);
    }

    function populateRunpodSelect(select, options, selectedValue, labelFor) {
      select.replaceChildren();
      options.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.innerText = labelFor(item);
        select.append(option);
      });
      if (options.some((item) => item.id === selectedValue)) {
        select.value = selectedValue;
      }
    }

    function formatRunpodAvailability(stock) {
      const normalized = String(stock || "none").trim().toLowerCase();
      if (["", "none", "unavailable", "sold out"].includes(normalized)) {
        return "Unavailable";
      }
      return String(stock);
    }

    function runpodStockAvailable(stock) {
      const normalized = String(stock || "none").trim().toLowerCase();
      return !["", "none", "unavailable", "sold out"].includes(normalized);
    }

    function runpodRegionSelectionChanged() {
      runpodConfigDirty = true;
      runpodOptionSignature = "";
      setText("runpod-config-status", "Unsaved deployment preference changes.");
      if (latestRunpodStatus) renderRunpodOptions(latestRunpodStatus);
    }

    function renderRunpodOptions(runpod) {
      latestRunpodStatus = runpod;
      const config = runpod.config || {};
      const gpuOptions = Array.isArray(runpod.gpu_options) ? runpod.gpu_options : [];
      const regionOptions = Array.isArray(runpod.data_center_options) ? runpod.data_center_options : [];
      const deploymentOptions = Array.isArray(runpod.deployment_region_options)
        ? runpod.deployment_region_options
        : [{ id: "north-america", name: "North America" }];
      const signature = JSON.stringify([
        deploymentOptions,
        gpuOptions.map((option) => [
          option.id,
          option.memory_gb,
          option.secure_price_per_hour,
          option.data_center_availability,
        ]),
        regionOptions.map((option) => [option.id, option.location, option.deployment_region]),
        runpodConfigDirty ? null : [
          config.allowed_gpu_ids,
          config.deployment_region,
          config.priority_data_center_ids || [config.priority_data_center_id],
        ],
      ]);
      if (signature !== runpodOptionSignature) {
        const deploymentSelect = document.getElementById("runpod-deployment-region");
        const existingPriorityInputs = document.querySelectorAll('input[name="runpod-priority-region"]');
        const existingGpuInputs = document.querySelectorAll('input[name="runpod-gpu"]');
        const selectedGpus = runpodConfigDirty && existingGpuInputs.length
          ? new Set(selectedRunpodValues("runpod-gpu"))
          : new Set(config.allowed_gpu_ids || []);
        const selectedDeployment = runpodConfigDirty && deploymentSelect.value
          ? deploymentSelect.value
          : (config.deployment_region || deploymentOptions[0]?.id || "");
        const selectedPriorities = runpodConfigDirty && existingPriorityInputs.length
          ? new Set(selectedRunpodValues("runpod-priority-region"))
          : new Set(
            config.priority_data_center_ids
              || [config.priority_data_center_id || config.preferred_data_center_id].filter(Boolean),
          );

        populateRunpodSelect(
          deploymentSelect,
          deploymentOptions,
          selectedDeployment,
          (option) => option.name || option.id,
        );
        const deploymentDataCenters = regionOptions.filter((option) => (
          !option.deployment_region || option.deployment_region === deploymentSelect.value
        ));
        deploymentSelect.onchange = runpodRegionSelectionChanged;

        const priorityContainer = document.getElementById("runpod-priority-region-options");
        priorityContainer.replaceChildren();
        deploymentDataCenters.forEach((option) => {
          const availableCardCount = gpuOptions.filter((gpu) => (
            runpodStockAvailable((gpu.data_center_availability || {})[option.id])
          )).length;
          const cardSummary = availableCardCount
            ? `${availableCardCount} available card${availableCardCount === 1 ? "" : "s"}`
            : "no supported cards available";
          addRunpodOption(
            priorityContainer,
            "runpod-priority-region",
            option.id,
            `${option.id} — ${option.location || deploymentSelect.value}, ${cardSummary}`,
            selectedPriorities.has(option.id),
            runpodRegionSelectionChanged,
          );
        });

        const gpuContainer = document.getElementById("runpod-card-options");
        gpuContainer.replaceChildren();
        const priorityDataCenters = selectedRunpodValues("runpod-priority-region");
        let availableGpuCount = 0;
        gpuOptions.forEach((option) => {
          const availability = option.data_center_availability || {};
          const availablePriorities = priorityDataCenters.filter((dataCenterId) => (
            runpodStockAvailable(availability[dataCenterId])
          ));
          if (!availablePriorities.length) return;
          availableGpuCount += 1;
          const details = [];
          if (Number.isFinite(option.memory_gb)) details.push(`${option.memory_gb} GB`);
          if (Number.isFinite(option.secure_price_per_hour)) details.push(`$${Number(option.secure_price_per_hour).toFixed(2)}/hr`);
          details.push(availablePriorities.map((dataCenterId) => (
            `${dataCenterId}: ${formatRunpodAvailability(availability[dataCenterId])}`
          )).join("; "));
          addRunpodOption(
            gpuContainer,
            "runpod-gpu",
            option.id,
            `${option.name || option.id} — ${details.join(", ")}`,
            selectedGpus.has(option.id),
          );
        });
        if (!availableGpuCount) {
          const empty = document.createElement("div");
          empty.className = "field-help";
          empty.innerText = priorityDataCenters.length
            ? "No supported H100, H200, or B200 cards currently have stock in the selected priority data centers."
            : "Select at least one priority data center to see available cards.";
          gpuContainer.append(empty);
        }
        const deploymentName = deploymentSelect.options[deploymentSelect.selectedIndex]?.text
          || "the deployment geography";
        const prioritySummary = priorityDataCenters.length
          ? `${priorityDataCenters.join(", ")} ${priorityDataCenters.length === 1 ? "is" : "are"} checked first. Other data centers in ${deploymentName} are automatic fallbacks. Only cards currently available in a selected priority data center are shown below.`
          : `Select at least one priority data center in ${deploymentName}.`;
        setText(
          "runpod-region-help",
          prioritySummary,
        );
        runpodOptionSignature = signature;
      }
    }

    function loadRunpodStatus() {
      getJson("/runpod/status")
        .then((runpod) => {
          renderRunpodSummary(runpod);
          renderRunpodOptions(runpod);
        })
        .catch((error) => {
          renderRunpodSummary({
            status: "error",
            phase: "manager_unavailable",
            message: error.message,
            desired_running: null,
          });
        });
    }

    function runRunpodAction(action) {
      setText("runpod-action-status", `${action === "start" ? "Start" : "Stop"} requested...`);
      fetch(`/runpod/${action}`, { method: "POST" })
        .then(async (response) => {
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.error || response.statusText);
          return body;
        })
        .then((runpod) => {
          renderRunpodSummary(runpod);
          setText("runpod-action-status", `${action === "start" ? "Start" : "Stop"} accepted.`);
          window.setTimeout(loadRunpodStatus, 500);
        })
        .catch((error) => {
          setText("runpod-action-status", `Action failed: ${error.message}`);
          loadRunpodStatus();
        });
    }

    function saveRunpodConfig() {
      const payload = {
        allowed_gpu_ids: selectedRunpodValues("runpod-gpu"),
        deployment_region: document.getElementById("runpod-deployment-region").value,
        priority_data_center_ids: selectedRunpodValues("runpod-priority-region"),
      };
      setText("runpod-config-status", "Saving...");
      fetch("/runpod/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(async (response) => {
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.error || response.statusText);
          return body;
        })
        .then((runpod) => {
          runpodConfigDirty = false;
          runpodOptionSignature = "";
          renderRunpodSummary(runpod);
          renderRunpodOptions(runpod);
          const suffix = runpod.configuration_applies_on_next_creation
            ? " The running/stopped pod will be replaced on the next start."
            : "";
          setText("runpod-config-status", `Saved.${suffix}`);
        })
        .catch((error) => {
          setText("runpod-config-status", `Save failed: ${error.message}`);
        });
    }

    function pointsFromJson(payload) {
      while (payload && typeof payload === "object" && !Array.isArray(payload)) {
        if (payload.vector) {
          payload = payload.vector;
        } else if (payload.continuous_path) {
          payload = payload.continuous_path.points;
        } else if (payload.coordinates) {
          payload = payload.coordinates;
        } else if (payload.path) {
          payload = payload.path;
        } else {
          break;
        }
      }
      if (!Array.isArray(payload)) {
        throw new Error("JSON does not contain path points");
      }
      const points = payload.map((point) => {
        if (!Array.isArray(point) || point.length < 2) {
          throw new Error("Path points must be [x, y] pairs");
        }
        return [Number(point[0]), Number(point[1])];
      });
      if (points.length < 2 || points.some(([x, y]) => !Number.isFinite(x) || !Number.isFinite(y))) {
        throw new Error("Path must contain at least two finite points");
      }
      return points;
    }

    function drawPathPreview() {
      const canvas = document.getElementById("path-preview");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, dim, dim);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, dim, dim);
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 1.5;

      if (previewPath.length < 2) {
        return;
      }

      ctx.beginPath();
      previewPath.forEach(([x, y], index) => {
        if (index === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
    }

    function previewJson(payload) {
      const points = pointsFromJson(payload);
      const xs = points.map(([x]) => x);
      const ys = points.map(([, y]) => y);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const spanX = Math.max(maxX - minX, 1e-9);
      const spanY = Math.max(maxY - minY, 1e-9);
      const padding = 12;
      const scale = Math.min((dim - 2 * padding) / spanX, (dim - 2 * padding) / spanY);
      const usedX = spanX * scale;
      const usedY = spanY * scale;
      const offsetX = padding + (dim - 2 * padding - usedX) / 2;
      const offsetY = padding + (dim - 2 * padding - usedY) / 2;
      previewPath = points.map(([x, y]) => [
        offsetX + (x - minX) * scale,
        offsetY + (y - minY) * scale
      ]);
      document.getElementById("path-preview-frame").classList.remove("hidden");
      drawPathPreview();
    }

    function selectedJsonFile() {
      return document.getElementById("json-file").files[0];
    }

    function previewSelectedJson() {
      const file = selectedJsonFile();
      if (!file) {
        previewPath = [];
        document.getElementById("path-preview-frame").classList.add("hidden");
        document.getElementById("json-plot-grid").classList.add("no-preview");
        setText("upload-status", "");
        return;
      }
      setText("upload-status", "Reading preview...");
      file.text()
        .then((text) => JSON.parse(text))
        .then((json) => {
          previewJson(json);
          document.getElementById("json-plot-grid").classList.remove("no-preview");
          setText("upload-status", "Preview ready.");
        })
        .catch((error) => {
          previewPath = [];
          document.getElementById("path-preview-frame").classList.add("hidden");
          document.getElementById("json-plot-grid").classList.add("no-preview");
          setText("upload-status", `Preview failed: ${error.message}`);
        });
    }

    function uploadJson() {
      const file = selectedJsonFile();
      if (!file) {
        setText("upload-status", "Choose a JSON file first.");
        return;
      }
      setText("upload-status", "Uploading...");
      file.text()
        .then((text) => JSON.parse(text))
        .then((json) => fetch("/draw", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(json),
        }))
        .then(async (response) => {
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(body.error || response.statusText);
          }
          return body;
        })
        .then((body) => {
          const planned = body.stats && body.stats.planned;
          if (planned) {
            setText("upload-status", `Queued ${planned.point_count} points, ${planned.path_length_mm.toFixed(1)}mm`);
          } else {
            setText("upload-status", "Queued.");
          }
          checkStatus();
        })
        .catch((error) => {
          setText("upload-status", `Upload failed: ${error.message}`);
        });
    }

    function selectedPhotoFile() {
      return document.getElementById("photo-file").files[0];
    }

    function choosePhoto() {
      document.getElementById("photo-file").click();
    }

    function uploadSelectedPhoto() {
      const file = selectedPhotoFile();
      if (!file) {
        setText("photo-upload-status", "");
        return;
      }
      const form = new FormData();
      form.append("image", file);
      setText("photo-upload-status", "Uploading...");
      fetch("/photo-upload", {
        method: "POST",
        body: form,
      })
        .then(async (response) => {
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(body.error || response.statusText);
          }
          return body;
        })
        .then((body) => {
          if (Number.isFinite(body.point_count)) {
            setText("photo-upload-status", `Ready with ${body.point_count} points.`);
          } else {
            setText("photo-upload-status", "Ready.");
          }
          checkStatus();
        })
        .catch((error) => {
          setText("photo-upload-status", `Upload failed: ${error.message}`);
          checkStatus();
        })
        .finally(() => {
          document.getElementById("photo-file").value = "";
        });
    }

	    window.addEventListener("load", () => {
	      checkStatus();
	      loadRunpodStatus();
	      loadCameraSettings();
	      setInterval(checkStatus, 1000);
	      setInterval(loadRunpodStatus, 3000);
	    });
  </script>
</head>

<body>
  <main>
    <h1>BSP Control</h1>

    <section>
      <h2>Machine</h2>
      <div class="actions">
        <button onclick="runMachineCommand('Min', '/min')">Min</button>
        <button onclick="runMachineCommand('Home', '/home')">Home</button>
        <button onclick="runMachineCommand('Max', '/max')">Max</button>
        <button class="primary" onclick="runMachineCommand('Button', '/button')">Button</button>
      </div>
      <div class="status-text" id="command-status"></div>
    </section>

	    <section>
	      <h2>Camera Preview</h2>
	      <div class="status-text" id="preview-status"></div>
	      <div class="preview-frame hidden" id="camera-preview-frame">
	        <img id="camera-preview" alt="Camera preview" />
	      </div>
	    </section>

	    <section>
	      <h2>Camera Settings</h2>
	      <div class="control-panel">
	        <div class="toggle-row">
	          <label for="camera-auto-exposure">Auto Exposure</label>
	          <input id="camera-auto-exposure" type="checkbox" onchange="updateCameraSettingLabels()" />
	          <span class="value-text"></span>
	        </div>
	        <div class="slider-row">
	          <label for="camera-exposure">Manual Exposure</label>
	          <input id="camera-exposure" type="range" min="3" max="500" step="1" value="100" oninput="updateCameraSettingLabels()" />
	          <span class="value-text" id="camera-exposure-value">100</span>
	        </div>
	        <div class="slider-row">
	          <label for="camera-gain">Gain</label>
	          <input id="camera-gain" type="range" min="0" max="255" step="1" value="0" oninput="updateCameraSettingLabels()" />
	          <span class="value-text" id="camera-gain-value">0</span>
	        </div>
	        <div class="actions">
	          <button onclick="loadCameraSettings()">Load</button>
	          <button class="primary" onclick="saveCameraSettings()">Apply</button>
	          <button onclick="previewWithCurrentCameraSettings()">Preview</button>
	        </div>
	      </div>
	      <div class="status-text" id="camera-settings-status"></div>
	    </section>

	    <section>
	      <h2>RunPod Processor</h2>
        <div class="control-panel">
          <div class="runpod-summary">
            <span class="status-pill" id="runpod-status-pill">loading</span>
            <span id="runpod-status-message">Loading RunPod status...</span>
          </div>
          <div class="endpoint-row">
            <label for="processor-endpoint-url">Processor Endpoint</label>
            <input id="processor-endpoint-url" type="url" readonly autocomplete="off" spellcheck="false" />
            <a class="button-link" id="processor-endpoint-open" href="#" target="_blank" rel="noopener">Open</a>
          </div>
          <div class="runpod-details" id="runpod-details">No managed pod yet.</div>
          <div class="actions">
            <button class="primary" id="runpod-start" onclick="runRunpodAction('start')">Start</button>
            <button id="runpod-stop" onclick="runRunpodAction('stop')">Stop</button>
            <button onclick="loadRunpodStatus()">Refresh</button>
          </div>
          <div class="status-text" id="runpod-action-status"></div>
          <fieldset>
            <legend>Deployment regions</legend>
            <div class="select-row">
              <label for="runpod-deployment-region">Deployment geography</label>
              <select id="runpod-deployment-region">
                <option>Loading...</option>
              </select>
            </div>
            <div>
              <div class="field-label" id="runpod-priority-region-label">Priority data centers</div>
              <div class="option-grid" id="runpod-priority-region-options" aria-labelledby="runpod-priority-region-label"></div>
            </div>
            <div class="field-help" id="runpod-region-help">Loading region availability...</div>
          </fieldset>
          <fieldset>
            <legend>Allowed cards</legend>
            <div class="option-grid" id="runpod-card-options"></div>
          </fieldset>
          <div class="actions">
            <button class="primary" onclick="saveRunpodConfig()">Save deployment preferences</button>
          </div>
          <div class="status-text" id="runpod-config-status"></div>
        </div>
	    </section>

	    <section>
	      <h2>Photo Capture</h2>
	      <input class="hidden-input" id="photo-file" type="file" accept="image/*" onchange="uploadSelectedPhoto()" />
	      <div class="actions">
	        <button class="primary" onclick="choosePhoto()">Choose or Take Photo</button>
	      </div>
	      <div class="status-text" id="photo-upload-status"></div>
	    </section>

	    <section>
	      <h2>JSON Plot</h2>
      <div class="media-grid no-preview" id="json-plot-grid">
        <div>
          <input id="json-file" type="file" accept="application/json,.json" onchange="previewSelectedJson()" />
          <div class="actions">
            <button class="primary" onclick="uploadJson()">Upload JSON and Plot</button>
          </div>
          <div class="status-text" id="upload-status"></div>
        </div>
        <div class="preview-frame hidden" id="path-preview-frame">
          <canvas id="path-preview" width="400" height="400"></canvas>
        </div>
      </div>
    </section>

    <section>
      <h2>Status</h2>
      <code id="status" class="status-text"></code>
    </section>
  </main>
</body>

</html>
