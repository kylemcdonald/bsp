<html>

<head>
  <link rel="icon" href="data:;base64,=" />
  <title>Control</title>
  <style>
    body {
      font-family: sans-serif;
    }

    input,
    button {
      margin: 0.5em 0;
      font-size: 1em;
    }

    .row {
      margin: 0.5em 0;
    }

    canvas {
      border: 1px solid #000;
      display: block;
    }

    #upload-status {
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.2.0/lib/p5.js"></script>
  <script>
    const dim = 400;
    let last;
    let path = [];

    function checkStatus() {
      fetch("/status")
        .then(e => e.json())
        .then(e => {
          select('#status').elt.innerText = JSON.stringify(e);
        });
    }

    function setup() {
      const c = createCanvas(dim, dim);
      c.mousePressed(mousePressedInner);
      c.mouseReleased(mouseReleasedInner);
      c.mouseMoved(mouseMovedInner);
      c.parent("container");
      background(220);
      setInterval(checkStatus, 1000);

      // for(let i = 0 ; i < 100; i++) {
      //   let theta = Math.random() * Math.PI * 2;
      //   let r = 180; //Math.random() * 200;
      //   let x = 200 + Math.cos(theta) * r;
      //   let y = 200 + Math.sin(theta) * r;
      //   path.push([x,y]);
      // }
    }

    function draw() {
      background(255);
      stroke(0);
      strokeWeight(1);
      noFill();
      if (path.length > 0) {
        beginShape();
        path.forEach((e) => vertex(...e));
        endShape();
      }
    }

    function mousePressedInner() {
      path = [];
    }

    function mouseMovedInner() {
      if (!mouseIsPressed) {
        return;
      }
      path.push([mouseX, mouseY]);
    }

    function mouseReleasedInner() {
      path.push([mouseX, mouseY]);
    }

    function createCircle(n, r) {
      path = [];
      for (let t = 0; t < n; t++) {
        const theta = map(t, 0, n - 1, 0, Math.PI * 2);
        const x = r * Math.cos(theta) + dim / 2;
        const y = r * Math.sin(theta) + dim / 2;
        path.push([x, y]);
      }
    }

    function circleClick() {
      createCircle(
        document.getElementById("circle-n").value,
        document.getElementById("circle-r").value
      );
    }

    function pointsFromJson(payload) {
      while (payload && typeof payload === "object" && !Array.isArray(payload)) {
        if (payload.vector) {
          payload = payload.vector;
        } else if (payload.continuous_path) {
          payload = payload.continuous_path.points;
        } else if (payload.coordinates) {
          payload = payload.coordinates;
        } else if (payload.path) {
          payload = payload.path;
        } else {
          break;
        }
      }
      if (!Array.isArray(payload)) {
        throw new Error("JSON does not contain path points");
      }
      const points = payload.map((point) => {
        if (!Array.isArray(point) || point.length < 2) {
          throw new Error("Path points must be [x, y] pairs");
        }
        return [Number(point[0]), Number(point[1])];
      });
      if (points.length < 2 || points.some(([x, y]) => !Number.isFinite(x) || !Number.isFinite(y))) {
        throw new Error("Path must contain at least two finite points");
      }
      return points;
    }

    function previewJson(payload) {
      const points = pointsFromJson(payload);
      const xs = points.map(([x]) => x);
      const ys = points.map(([, y]) => y);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const spanX = Math.max(maxX - minX, 1e-9);
      const spanY = Math.max(maxY - minY, 1e-9);
      const padding = 12;
      const scale = Math.min((dim - 2 * padding) / spanX, (dim - 2 * padding) / spanY);
      const usedX = spanX * scale;
      const usedY = spanY * scale;
      const offsetX = padding + (dim - 2 * padding - usedX) / 2;
      const offsetY = padding + (dim - 2 * padding - usedY) / 2;
      path = points.map(([x, y]) => [
        offsetX + (x - minX) * scale,
        offsetY + (y - minY) * scale
      ]);
    }

    function send() {
      const limit = 100;
      const scale = limit / dim;
      const scaledPath = path.map(([x, y]) => [
        limit - (x * scale),
        (y * scale)
      ]);
      fetch("/draw", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          path: {
            continuous_path: {
              points: scaledPath
            }
          },
          raw: true
        }),
      });
    }

    function sendWithDelay() {
      setTimeout(send, 2000);
    }

    function uploadJson() {
      const input = document.getElementById("json-file");
      const status = document.getElementById("upload-status");
      const file = input.files[0];
      if (!file) {
        status.innerText = "Choose a JSON file first.";
        return;
      }
      status.innerText = "Reading...";
      file.text()
        .then((text) => JSON.parse(text))
        .then((json) => {
          previewJson(json);
          status.innerText = "Uploading...";
          return fetch("/draw", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(json),
          });
        })
        .then(async (response) => {
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(body.error || response.statusText);
          }
          return body;
        })
        .then((body) => {
          const planned = body.stats && body.stats.planned;
          if (planned) {
            status.innerText = `Queued ${planned.point_count} points, ${planned.path_length_mm.toFixed(1)}mm`;
          } else {
            status.innerText = "Queued";
          }
          checkStatus();
        })
        .catch((error) => {
          status.innerText = `Upload failed: ${error.message}`;
        });
    }

    function previewSelectedJson() {
      const input = document.getElementById("json-file");
      const status = document.getElementById("upload-status");
      const file = input.files[0];
      if (!file) {
        path = [];
        status.innerText = "";
        return;
      }
      status.innerText = "Reading preview...";
      file.text()
        .then((text) => JSON.parse(text))
        .then((json) => {
          previewJson(json);
          status.innerText = "Preview ready.";
        })
        .catch((error) => {
          path = [];
          status.innerText = `Preview failed: ${error.message}`;
        });
    }
  </script>
</head>

<body>
  <div>
    <button onclick="fetch('/go?x=0&y=0')">Min</button>
    <button onclick="fetch('/home')">Home</button>
    <button onclick="fetch('/go?x=100&y=100')">Max</button>
  </div>
  <div>
    <input type="range" min="4" max="512" value="256" id="circle-n" oninput="circleClick()" />
    <input type="range" min="10" max="200" value="150" id="circle-r" oninput="circleClick()" />
    Circle
  </div>
  <div id="container"></div>
  <button onclick="send()">Send</button>
  <button onclick="sendWithDelay()">Send with delay</button>
  <button onclick="fetch('/stop')">Stop</button>
  <button onclick="fetch('/button')">Button</button>
  <div class="row">
    <input id="json-file" type="file" accept="application/json,.json" onchange="previewSelectedJson()" />
    <button onclick="uploadJson()">Upload JSON and Plot</button>
    <div id="upload-status"></div>
  </div>
  <div style="font-family: monospace">
    Status:
    <span id="status"></span>
  </div>
</body>

</html>
